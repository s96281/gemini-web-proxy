[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-web-proxy"
version = "0.1.0"
description = "Personal Gemini Web to OpenAI Chat Completions bridge"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.5",
  "uvicorn==0.49.0",
  "pydantic-settings==2.16.2",
  "gemini-webapi==2.1.1",
  "playwright==1.65.1",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "openai>=2,<3", "ruff>=0.14,<1"]

[project.scripts]
gemini-proxy = "gemini_proxy.cli:main"

[tool.setuptools.packages.find]
include = ["gemini_proxy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
